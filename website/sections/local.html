<section id="local">
  <div class="wrap">
    <div class="tile">
      <h2>在你自己的电脑上干活</h2>
      <div class="local scene" data-scene>
        <div class="mac">
          <div class="mac-screen">
            <span class="chip">{{icon:folder}}项目代码</span><span class="chip">{{icon:file}}合同.pdf</span><span class="chip">{{icon:file}}周报.md</span>
            <div class="m-row">{{bot:drop:cyan:working}}{{bot:square:purple:thinking}}{{bot:cloud:blue}}{{bot:flower:orange:working}}</div>
          </div>
          <div class="mac-base"></div>
          <span class="cap">你的电脑</span>
        </div>
        <div class="wire"><i></i><i></i></div>
        <div class="gate">
          <div class="gate-box">{{icon:cloud}}<span class="chip">账号</span><span class="chip">额度</span><span class="chip">模型</span></div>
          <span class="cap">网关</span>
        </div>
      </div>
    </div>
  </div>
</section>
