appId: com.hezuobot.app
productName: HezuoBot
artifactName: HezuoBot-${version}-${arch}.${ext}

protocols:
  - name: HezuoBot package install
    schemes: [hezuobot]

publish: null

directories:
  buildResources: desktop/build
  output: release/product

# electron-builder makes copied directories group-writable by default. The
# Linux CUA trust boundary requires root-owned package ancestors to be 0755.
afterPack: ./scripts/after-pack.mjs

# The app is three self-contained pieces, none needing node_modules at
# runtime: the Electron main/preload (plain .mjs/.cjs), the built UI
# (Vite → ui/), and the compiled harness server (tsc → desktop/server/), both
# shipped in Resources and run on Electron's own Node via
# ELECTRON_RUN_AS_NODE (the agentcal-hq pattern).
files:
  - desktop/electron/**
  - "!desktop/electron/**/*.test.*"
  - "!desktop/electron/resources/speech-helper"
  - "!desktop/electron/resources/speech-helper.swift"
  - "!desktop/electron/resources/speech-helper-Info.plist"
  - "!desktop/electron/resources/Hezuo Speech.app/**"
  # The Teach a skill recorder is gone, but a machine that once ran
  # `pnpm build:recorder` may still hold its helper build; never ship it.
  - "!desktop/electron/resources/recorder-helper"
  - "!desktop/electron/resources/recorder-helper.swift"
  - "!desktop/electron/resources/recorder-helper-Info.plist"
  - "!desktop/electron/resources/* Recorder.app/**"
  - "!**/node_modules/**"
  - package.json

extraMetadata:
  productName: HezuoBot
  desktopName: com.hezuobot.app.desktop
  hezuoProductManaged: true

asar: true

extraResources:
  # Ship the app's own license terms in every desktop distribution.
  - from: LICENSE
    to: licenses/HezuoBot-LICENSE.txt
  - from: NOTICE
    to: licenses/HezuoBot-NOTICE.txt
  - from: third_party/hpke-js/core-LICENSE.txt
    to: licenses/hpke-core-LICENSE.txt
  - from: third_party/hpke-js/common-LICENSE.txt
    to: licenses/hpke-common-LICENSE.txt
  # The model provider catalog: models.dev data and OpenCode's refresh logic.
  - from: third_party/models-dev/LICENSE
    to: licenses/models-dev-LICENSE.txt
  - from: third_party/opencode/LICENSE
    to: licenses/opencode-LICENSE.txt
  # Code adapted from T3 Code (MIT): the bots' browser egress gate, the Antigravity runtime, citations.
  - from: third_party/t3-code/LICENSE
    to: licenses/t3-code-LICENSE.txt
  # The 1Password SDK and its WebAssembly core (MIT; saved logins from
  # 1Password, staged in the duckdb resource tree). Neither npm package
  # carries its license text, so the upstream file travels here.
  - from: third_party/onepassword-sdk/LICENSE
    to: licenses/1password-sdk-LICENSE.txt
  - from: dist
    to: ui
  - from: dist-server
    to: server
  # the companion sidecar — a separate process because it is the only part
  # of the app that listens off this machine, and it stays off until asked
  - from: dist-companion
    to: companion
  - from: skills
    to: skills

mac:
  publish: null
  # Two single-arch artifacts rather than one universal binary: the app is
  # architecture-specific, and universal would make users download both halves.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: desktop/build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: desktop/build/entitlements.mac.plist
  entitlementsInherit: desktop/build/entitlements.mac.plist
  # the dictation helper is a signed background app — Windows and Linux never see it
  extraResources:
    - from: desktop/electron/resources/Hezuo Speech.app
      to: Hezuo Speech.app
    # CUA must live outside ASAR. prepare-cua stages the signed executable and
    # a self-contained JS/native SDK bundle selected for macOS arm64.
    # ${arch} resolves per built arch — each bundle carries its own natives
    - from: dist-native/${arch}/cua-driver
      to: cua-driver
    - from: dist-native/${arch}/cua-sdk
      to: cua-sdk
    - from: dist-native/browser/darwin-${arch}
      to: browser-engine
    # The Data engine's native modules (DuckDB, resvg; desktop/server/data/engine.ts)
    # as a node_modules tree the server requires at runtime; prepare-duckdb
    # stages this arch's slice. The copy names the node_modules directory
    # itself: electron-builder's resource filter drops a root-level
    # node_modules entry of any tree it copies (app-builder-lib util/filter).
    - from: dist-native/duckdb/darwin-${arch}/node_modules
      to: duckdb/node_modules
  extendInfo:
    # Without this string macOS' Local Network privacy gate refuses the app's
    # outbound LAN sockets (EHOSTUNREACH) and never shows a consent prompt, so a
    # build that signs in to a gateway on a private/LAN address cannot reach it.
    NSLocalNetworkUsageDescription: Hezuo signs in to and talks with your team's gateway on this local network.
    NSMicrophoneUsageDescription: Hezuo uses the microphone for voice dictation into the composer.
    NSSpeechRecognitionUsageDescription: Hezuo transcribes your voice on-device to type messages for you.
    NSAccessibilityUsageDescription: Hezuo uses Accessibility when you let a bot control this Mac.
    NSScreenCaptureUsageDescription: Hezuo uses Screen Recording so bots can see this Mac before acting.
  # Notarization runs manually after the build (notarytool + staple),
  # mirroring the BlueyLite ship_release.sh flow.
  notarize: false

dmg:
  publish: null
  sign: true
  # ${arch} is load-bearing: without it the x64 dmg silently overwrites
  # the arm64 one when both arches build (this section overrides both the
  # top-level and mac-level artifactName, so it must carry the arch itself)
  artifactName: HezuoBot-${version}-${arch}.dmg
  # x/y are icon centres in points. electron-builder 26.15.3 sizes the window
  # from desktop/build/background.png and ignores dmg.window whenever a background is set.
  iconSize: 112
  iconTextSize: 13
  contents:
    - x: 180
      y: 206
    - x: 540
      y: 206
      type: link
      path: /Applications

win:
  publish: null
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
  icon: desktop/build/icon.ico
  extraResources:
    - from: dist-native/browser/win32-x64
      to: browser-engine
    - from: dist-native/duckdb/win32-x64/node_modules
      to: duckdb/node_modules
    # CUA driver and SDK for Windows — must live outside ASAR for native modules
    - from: dist-native/cua-win32-x64/cua-driver.exe
      to: cua-driver.exe
    - from: dist-native/cua-win32-x64/cua-driver-background.exe
      to: cua-driver-background.exe
    - from: dist-native/cua-win32-x64/cua-sdk
      to: cua-sdk
nsis:
  publish: null
  oneClick: true
  perMachine: false
  shortcutName: HezuoBot
  artifactName: HezuoBot-${version}-${arch}-setup.${ext}

linux:
  publish: null
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  # Keep the vector source in the freedesktop scalable icon hierarchy. A
  # lone 1024px PNG is not indexed by GNOME's hicolor theme on Ubuntu 24.04.
  icon: desktop/build/icon.svg
  category: Utility
  executableName: hezuobot
  synopsis: Your own team of AI bots, in a chat app
  description: A local-first chat app for running a team of AI agents.
  # Supply the release maintainer's real identity and contact at packaging time.
  maintainer: ${env.HEZUO_PACKAGE_MAINTAINER}
  vendor: HezuoBot
  syncDesktopName: true
  # The reviewed x64 CLI runtime is staged before packaging and remains
  # outside ASAR so executable modes and adjacent sidecars are preserved.
  extraResources:
    - from: dist-native/cua-linux-x64
      to: cua-linux-x64
    - from: dist-native/browser/linux-x64
      to: browser-engine
    - from: dist-native/duckdb/linux-x64/node_modules
      to: duckdb/node_modules
    - from: desktop/build/linux-hezuobot-browser.apparmor
      to: hezuobot-browser.apparmor
  desktop:
    entry:
      Name: HezuoBot
      Comment: Your own team of AI bots, in a chat app
      Keywords: AI;Agents;Chat;Productivity;

deb:
  publish: null
  packageName: hezuobot
  artifactName: HezuoBot-${version}-${arch}.${ext}
  packageCategory: utils
  priority: optional
  # Add the narrow browser policy's parser without replacing Electron's
  # default shared-library dependencies.
  fpm: ["--depends", "apparmor"]
  # dpkg can preserve legacy directory modes during an upgrade. This
  # idempotent hook repairs only the exact package-owned CUA path.
  afterInstall: desktop/build/linux-after-install.sh
  afterRemove: desktop/build/linux-after-remove.sh

# Static AppImage runtime: Ubuntu 24.04 can launch it without legacy FUSE 2.
toolsets:
  appimage: "1.0.3"
